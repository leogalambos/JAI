# Source-tree approval gate for AI IT House.
# Branch protection + a required check puts author/approver separation somewhere no prompt can reach.
name: validate-library

on:
  pull_request:
    paths:
      - '.ai/**'
      - '.github/**'
      - 'tools/**'
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'tests/**'
      - 'apps/fabric-explorer/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'requirements-ci.txt'
      - 'ci/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'RELEASE-SCOPE.json'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jai-validation-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  fabric-explorer-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/fabric-explorer/packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select contract checks by changed inputs
        id: contract-impact
        working-directory: .
        env:
          CONTRACT_EVENT: ${{ github.event_name }}
          CONTRACT_PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$CONTRACT_EVENT" = pull_request ]; then
            contract_base=HEAD^
          else
            contract_base="$CONTRACT_PUSH_BASE"
          fi
          if [ "$CONTRACT_EVENT" = workflow_dispatch ] || ! git cat-file -e "${contract_base}^{commit}" 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Contract checks selected: explicit run or unavailable change baseline.'
          elif git diff --quiet "$contract_base" HEAD -- \
            apps/fabric-explorer/packages/contracts \
            docs/fabric-explorer/contracts.md docs/fabric-explorer/source-contract.md \
            docs/fabric-explorer/architecture.md docs/fabric-explorer/qualification.md \
            apps/fabric-explorer/test/fixtures apps/fabric-explorer/config \
            apps/fabric-explorer/.node-version .github/workflows/validate-library.yml \
            .ai/runtime/protocol/governed-delivery \
            .ai/runtime/tools/lifecycle.py .ai/runtime/tools/findings.py \
            .ai/runtime/tools/governed_records.py .ai/runtime/tools/governed_audit.py \
            .ai/runtime/tools/governed_delivery.py; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Contract inputs unchanged; preserve existing package evidence.'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Contract checks selected: affected inputs or unknown diff status.'
          fi
      - uses: actions/setup-node@v4
        if: steps.contract-impact.outputs.run == 'true'
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: apps/fabric-explorer/packages/contracts/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.contract-impact.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Select admitted npm build version
        if: steps.contract-impact.outputs.run == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/fabric-explorer-toolchain" --ignore-scripts --no-audit --no-fund npm@11.21.2
          echo "$RUNNER_TEMP/fabric-explorer-toolchain/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install locked contract dependencies without lifecycle scripts
        if: steps.contract-impact.outputs.run == 'true'
        run: |
          test "$(node --version)" = v24.22.2
          test "$(npm --version)" = 11.21.2
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test read-only semantic and IPC contracts
        if: steps.contract-impact.outputs.run == 'true'
        working-directory: .
        run: |
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- npm --prefix apps/fabric-explorer/packages/contracts run build
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- npm --prefix apps/fabric-explorer/packages/contracts test
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- npm --prefix apps/fabric-explorer/packages/contracts run test:built

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install Python dependencies without release renderers
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-ci.txt
          python3 -m pip check
      - name: Audit mandatory sources for live provider execution
        run: python3 .ai/runtime/tools/offline_guard.py scan --root .
      - name: Product version, policy and documentation contracts
        run: |
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 scripts/versioning.py check --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/scripts/check_agent_policy.py --fast .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/generate_docs.py --check --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/docs_contract.py --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/content_spec.py lint-registry --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 tools/generate_content_workflows.py --check
          python3 tools/generate_output_contract_docs.py --root . --check
          python3 tools/generate_role_output_guidance.py --root . --check
          python3 tools/generate_content_catalog.py --check
          python3 tools/generate_reference_completion.py --root . --role-examples --check
          python3 tools/generate_workflow_diagrams.py --root . --check
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/expert_references.py validate --root . --all
      - name: Fabric Explorer source and read-only feasibility checks
        run: python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 -u -m pytest -q tests/test_fabric_explorer_sources.py apps/fabric-explorer/reader/test/test_windows_readonly.py tests/test_fabric_explorer_helper.py apps/fabric-explorer/reader/test/test_readonly_files.py apps/fabric-explorer/reader/test/test_read_broker.py tests/test_operator_journal_snapshot.py
      - name: P0 runtime security application regression (host coverage reported separately)
        run: python3 .ai/runtime/tools/offline_guard.py run --stream --root . --timeout 300 -- python3 -u -m pytest -vv -rs tests/test_agent_runtime.py tests/test_integration_adapters.py tests/test_guard_library_write.py tests/test_fabric_authority_boundary.py tests/test_governed_domain.py tests/test_gen2_command_integrations.py

      - name: Execution profiles and efficiency regressions
        run: python3 .ai/runtime/tools/offline_guard.py run --stream --root . --timeout 300 -- python3 -u -m pytest -vv -rs tests/test_execution_profiles.py tests/test_execution_stats.py tests/test_execution_profile_runtime.py tests/test_workload_routing.py tests/test_workload_routing_runtime.py tests/test_session_routing_context.py tests/test_model_execution_kind.py tests/test_professional_review.py tests/test_professional_review_cli.py

      - name: Gate checker positive and negative regression
        run: |
          printf 'G1: pass\nG2: pass\nG3: pass\nG4: pass\nG5: pass\n' > /tmp/gc-pass.txt
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/skills/it-roles-architecture/scripts/check_gates.py --skill .ai/skills/it-roles-architecture/references/solution-architect.md /tmp/gc-pass.txt
          printf 'G1: pass\n' > /tmp/gc-incomplete.txt
          if python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/skills/it-roles-architecture/scripts/check_gates.py --skill .ai/skills/it-roles-architecture/references/solution-architect.md /tmp/gc-incomplete.txt; then
            echo '::error::An incomplete gate set was incorrectly accepted'
            exit 1
          fi

      - name: Reject a self-approved change
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          # Fail closed if reviews cannot be queried; an empty successful result
          # means no approvals yet, not proof that another user approved.
          if ! APPROVERS="$(gh pr view "$PR_NUMBER" --json reviews \
              --jq '.reviews[]|select(.state=="APPROVED").author.login' 2>&1)"; then
            echo "::error::Unable to verify independent approval: $APPROVERS"
            exit 1
          fi
          for R in $APPROVERS; do
            if [ "$R" = "$AUTHOR" ]; then
              echo "::error::$AUTHOR both authored and approved this change"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
