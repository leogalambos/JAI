# Source-tree approval gate for AI IT House.
# Branch protection + a required check puts author/approver separation somewhere no prompt can reach.
name: validate-library

on:
  pull_request:
    paths:
      - '.ai/**'
      - '.github/**'
      - 'tools/**'
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'requirements-ci.txt'
      - 'ci/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'RELEASE-SCOPE.json'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_qualification:
        description: Execute the complete A-H release preflight (expensive)
        type: boolean
        default: false

concurrency:
  group: jai-validation-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    if: github.event_name != 'workflow_dispatch' || !inputs.full_qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install Python dependencies without release renderers
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-ci.txt
          python3 -m pip check
      - name: Audit mandatory sources for live provider execution
        run: python3 .ai/runtime/tools/offline_guard.py scan --root .
      - name: Product version, policy and documentation contracts
        run: |
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 scripts/versioning.py check --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/scripts/check_agent_policy.py --fast .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/generate_docs.py --check --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/docs_contract.py --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/content_spec.py lint-registry --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/expert_references.py validate --root . --all
      - name: Bounded source smoke tests (not release qualification)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_test_plan.py quick > "$RUNNER_TEMP/jai-quick-tests.txt"
          mapfile -t modules < "$RUNNER_TEMP/jai-quick-tests.txt"
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . --timeout 180 -- python3 -u -m pytest -vv -s "${modules[@]}"

      - name: P0 runtime security application regression (host coverage reported separately)
        run: python3 .ai/runtime/tools/offline_guard.py run --stream --root . --timeout 120 -- python3 -u -m pytest -vv -rs tests/test_agent_runtime.py tests/test_integration_adapters.py tests/test_guard_library_write.py tests/test_fabric_authority_boundary.py tests/test_commercial_runtime.py

      - name: Gate checker positive and negative regression
        run: |
          printf 'G1: pass\nG2: pass\nG3: pass\nG4: pass\nG5: pass\n' > /tmp/gc-pass.txt
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/skills/it-roles-architecture/scripts/check_gates.py --skill .ai/skills/it-roles-architecture/references/solution-architect.md /tmp/gc-pass.txt
          printf 'G1: pass\n' > /tmp/gc-incomplete.txt
          if python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/skills/it-roles-architecture/scripts/check_gates.py --skill .ai/skills/it-roles-architecture/references/solution-architect.md /tmp/gc-incomplete.txt; then
            echo '::error::An incomplete gate set was incorrectly accepted'
            exit 1
          fi

      - name: Reject a self-approved change
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          # Fail closed if reviews cannot be queried; an empty successful result
          # means no approvals yet, not proof that another user approved.
          if ! APPROVERS="$(gh pr view "$PR_NUMBER" --json reviews \
              --jq '.reviews[]|select(.state=="APPROVED").author.login' 2>&1)"; then
            echo "::error::Unable to verify independent approval: $APPROVERS"
            exit 1
          fi
          for R in $APPROVERS; do
            if [ "$R" = "$AUTHOR" ]; then
              echo "::error::$AUTHOR both authored and approved this change"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

  release-preflight:
    name: Full A-H release preflight without publication
    if: github.event_name == 'workflow_dispatch' && inputs.full_qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout candidate source independently of policy checks
        uses: actions/checkout@v4
      - name: Prepare canonical qualification environment
        uses: ./.github/actions/setup-qualification
      - name: Audit mandatory sources for live provider execution
        run: python3 .ai/runtime/tools/offline_guard.py scan --root .
      - name: Build documentation site
        run: python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 -m mkdocs build --strict
      - name: Supplementary tests outside Gate A (each module once)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_test_plan.py supplementary > "$RUNNER_TEMP/jai-supplementary-tests.txt"
          mapfile -t modules < "$RUNNER_TEMP/jai-supplementary-tests.txt"
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . --timeout 900 -- python3 -u -m pytest -vv -s "${modules[@]}"
      - name: Gate checker positive and negative regression
        run: |
          printf 'G1: pass\nG2: pass\nG3: pass\nG4: pass\nG5: pass\n' > /tmp/gc-pass.txt
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/skills/it-roles-architecture/scripts/check_gates.py --skill .ai/skills/it-roles-architecture/references/solution-architect.md /tmp/gc-pass.txt
          printf 'G1: pass\n' > /tmp/gc-incomplete.txt
          if python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/skills/it-roles-architecture/scripts/check_gates.py --skill .ai/skills/it-roles-architecture/references/solution-architect.md /tmp/gc-incomplete.txt; then
            echo '::error::An incomplete gate set was incorrectly accepted'
            exit 1
          fi

      - name: Additional registry and provider checks
        run: |
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 scripts/versioning.py check --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/content_spec.py lint-registry --root .
          PYTHONPATH=.ai/runtime/tools python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/provider_parity.py
      - name: Execute the complete release qualification before tagging
        run: |
          qualification_budget="$(python3 .ai/runtime/tools/qualification_core.py budget --scope qualification)"
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . --timeout "$qualification_budget" -- python3 -u .ai/runtime/tools/release_ga.py qualify
      - name: Verify generated release evidence without publishing
        run: |
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/release_policy.py check --final
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/supply_chain.py verify --root . \
            --sbom SBOM.spdx.json --provenance PROVENANCE.json \
            --compatibility COMPATIBILITY.json
      - name: Build the candidate archive and verify its checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/release_bundle.py build --root . --dist dist
          cd dist
          sha256sum -c ai-it-house-universal-*.sha256
      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jai-release-preflight
          path: |
            ${{ runner.temp }}/jai-ci-environment.json
            ${{ runner.temp }}/jai-ci-python-freeze.txt
            .ai/runtime/_meta/gates/*.json
            .ai/runtime/_meta/qualification-A-G.json
            QUALIFICATION-A-H.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
