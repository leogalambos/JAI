name: Validate and publish JAI release

on:
  push:
    tags:
      - 'release@*'

permissions:
  contents: read

concurrency:
  group: jai-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged source on main
        run: |
          set -eu
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Validate exact release tag and committed version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          python3 scripts/validate_release_tag.py --tag "$RELEASE_TAG" --root .
          python3 scripts/versioning.py check --tag "$RELEASE_TAG" --root .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast source and documentation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate current source and public documentation contracts
        run: |
          set -eu
          python3 .ai/runtime/tools/offline_guard.py scan --root .
          python3 .ai/runtime/tools/license_check.py .
          python3 tools/generate_output_contract_docs.py --root . --check
          python3 tools/generate_role_output_guidance.py --root . --check
          python3 tools/generate_content_catalog.py --check
          python3 tools/generate_reference_completion.py --root . --role-examples --check
          python3 tools/generate_workflow_diagrams.py --root . --check
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/scripts/check_agent_policy.py --fast .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/docs_contract.py --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/content_spec.py lint-registry --root .
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 tools/generate_content_workflows.py --check
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/expert_references.py validate --root . --all
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/provider_parity.py
      - name: Build public documentation
        run: python3 -m mkdocs build --strict
      - name: Build source archive, checksum and dependency inventory
        run: |
          set -eu
          python3 .ai/runtime/tools/release_bundle.py build --root . --dist dist
          python3 .ai/runtime/tools/supply_chain.py sbom --root . --out dist/SBOM.spdx.json
          cd dist
          sha256sum -c ai-it-house-universal-*.sha256
      - name: Attest the source archive when supported
        if: ${{ !github.event.repository.private || vars.JAI_ATTEST_PRIVATE == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: dist/ai-it-house-universal-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jai-release-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SBOM.spdx.json

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jai-release-candidate
          path: candidate
      - name: Verify candidate and publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          cd candidate
          sha256sum -c "ai-it-house-universal-${RELEASE_VERSION}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::Release already exists; refusing replacement'
            exit 1
          fi
          cat > "$RUNNER_TEMP/jai-release-notes.md" <<EOF
          # JAI ${RELEASE_VERSION}

          Source tag: \`${RELEASE_TAG}\`.

          Download the source archive and verify it with the attached SHA-256
          checksum. The SPDX inventory describes declared dependencies and source
          file identities; it is not a complete installed dependency inventory.

          GitHub checks source contracts, public documentation and archive integrity.
          Comprehensive regressions are an operator-run local prepublication step.
          These checks do not grant business acceptance or qualify every live
          provider environment.
          GitHub build attestations are available where supported by the repository.
          EOF
          gh release create "$RELEASE_TAG" \
            "ai-it-house-universal-${RELEASE_VERSION}.zip" \
            "ai-it-house-universal-${RELEASE_VERSION}.sha256" SBOM.spdx.json \
            --verify-tag --latest --title "$RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/jai-release-notes.md"
