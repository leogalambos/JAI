name: Build and publish documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'hooks/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'requirements-ci.txt'
      - '.github/workflows/pages.yml'
      - '.ai/commands/**'
      - '.ai/runtime/tools/docs_contract.py'
      - '.ai/runtime/tools/generate_docs.py'
      - 'tools/generate_output_contract_docs.py'
      - 'tools/generate_workflow_diagrams.py'
      - 'tools/content_catalog_definitions.py'
      - 'tools/content_reference_definitions.py'
      - 'tools/generate_content_catalog.py'
      - 'tools/generate_content_workflows.py'
      - '.ai/runtime/content/**'
      - '.ai/runtime/artifacts/contracts/**'
      - '.ai/runtime/tools/content_spec.py'
      - '.ai/runtime/tools/schema_resolver.py'
      - '.ai/runtime/tools/guide_alias.py'
      - 'VERSION'
      - 'RELEASE-SCOPE.json'
      - '.ai/runtime/roles.json'
      - '.ai/runtime/workflows.json'
      - '.ai/runtime/artifacts/schema/artifact-types.json'
      - '.ai/runtime/schema/schema-registry.json'
      - '.ai/agents/**'
      - '.ai/skills/**'
      - '.ai/adapters/**'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'hooks/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'requirements-ci.txt'
      - '.github/workflows/pages.yml'
      - '.ai/commands/**'
      - '.ai/runtime/tools/docs_contract.py'
      - '.ai/runtime/tools/generate_docs.py'
      - 'tools/generate_output_contract_docs.py'
      - 'tools/generate_workflow_diagrams.py'
      - 'tools/content_catalog_definitions.py'
      - 'tools/content_reference_definitions.py'
      - 'tools/generate_content_catalog.py'
      - 'tools/generate_content_workflows.py'
      - '.ai/runtime/content/**'
      - '.ai/runtime/artifacts/contracts/**'
      - '.ai/runtime/tools/content_spec.py'
      - '.ai/runtime/tools/schema_resolver.py'
      - '.ai/runtime/tools/guide_alias.py'
      - '.ai/runtime/roles.json'
      - '.ai/runtime/workflows.json'
      - '.ai/runtime/artifacts/schema/artifact-types.json'
      - '.ai/runtime/schema/schema-registry.json'
      - '.ai/agents/**'
      - '.ai/skills/**'
      - '.ai/adapters/**'
      - 'VERSION'
      - 'RELEASE-SCOPE.json'
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate canonical Markdown and native command documentation
        run: |
          python scripts/versioning.py check --root .
          python .ai/runtime/tools/docs_contract.py --root .
          python .ai/runtime/tools/generate_docs.py --check --root .
          python tools/generate_output_contract_docs.py --root . --check
          python tools/generate_workflow_diagrams.py --root . --check
      - name: Validate and build documentation
        run: python -m mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Publish build artifact
        uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
