sections:
  - id: app-state
    delivery: required
    source: architecture
    text: Define UI and data responsibilities, state ownership and lifecycle boundaries. Verify state
      and data behavior across rotation or recreation, process restart and loss of connectivity where
      applicable.
    applicability: Android applications targeting an explicitly selected SDK and device range. Android
      16 is a documented reference baseline; confirm actual platform and toolchain versions.
    exclusions: Backend implementation, independent acceptance, unauthorized production publishing and
      unsupported device claims.
    reviewed: '2026-11-24'
    owner: JAI mobile engineering maintainers
    scope:
      product:
      - android
      activity:
      - android-lifecycle
    classification:
      reviewer: Codebase Reviewer (reviewed applicability assessment)
      rule_version: 1
      binding_sha256: bc264f964357b5d79f47912ba4027b4b2de734ed53b850d41ec38bf29160509e
  - id: release-evidence
    delivery: required
    source: build-toolchain
    text: Pin minSdk, targetSdk, compileSdk and the build toolchain. Check device compatibility and
      release behavior on representative supported targets. Record instrumentation, signing ownership
      and the authorized rollout or reversal path.
    applicability: Android applications targeting an explicitly selected SDK and device range. Android
      16 is a documented reference baseline; confirm actual platform and toolchain versions.
    exclusions: Backend implementation, independent acceptance, unauthorized production publishing and
      unsupported device claims.
    reviewed: '2026-11-24'
