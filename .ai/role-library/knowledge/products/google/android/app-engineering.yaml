      16 is a documented reference baseline; confirm actual platform and toolchain versions.
    exclusions: Backend implementation, independent acceptance, unauthorized production publishing and
      unsupported device claims.
    reviewed: '2026-11-24'
    owner: JAI mobile engineering maintainers
