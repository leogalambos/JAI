schema_version: 1
id: products/sap/abap-cloud/released-extensibility
title: SAP ABAP Cloud released extensibility
version: 1.0.0
includes: []
applicability: ABAP Cloud developer extensibility for applicable SAP Cloud ERP tenants. Use release-specific
  ABAP RAP guidance and verify actual target availability.
sections:
  - id: released-contract
    delivery: required
    source: abap-cloud-concepts
    text: Use the approved ABAP language version and released extension points and APIs. Verify the
      release state of dependencies for the selected deployment before using them. Check RAP applicability
      for service extensions where required.
    applicability: ABAP Cloud developer extensibility for applicable SAP Cloud ERP tenants. Use release-specific
      ABAP RAP guidance and verify actual target availability.
    exclusions: Classic ABAP modifications, unreleased dependency use and assuming SAP BTP or other
      SAP editions have the same capabilities.
    reviewed: '2026-11-24'
    owner: JAI erp extension engineering maintainers
  - id: upgrade-evidence
    delivery: required
    source: rap-releases
    text: Pin the tenant release and transport scope. Record applicable verification and regression
      tests, authorization behavior and upgrade impact. Escalate unsupported or unreleased dependencies
      instead of treating them as approved extension points.
    applicability: ABAP Cloud developer extensibility for applicable SAP Cloud ERP tenants. Use release-specific
      ABAP RAP guidance and verify actual target availability.
    exclusions: Classic ABAP modifications, unreleased dependency use and assuming SAP BTP or other
      SAP editions have the same capabilities.
    reviewed: '2026-11-24'
    owner: JAI erp extension engineering maintainers
  - id: verification-reference
    delivery: optional
    source: developer-extensibility
    reference: released-extensibility-evidence.md
    read_when: Recheck the product release, system landscape, ABAP language version, object release
      state and transport prerequisites when changing an extension.
    applicability: ABAP Cloud developer extensibility for applicable SAP Cloud ERP tenants. Use release-specific
      ABAP RAP guidance and verify actual target availability.
    exclusions: Classic ABAP modifications, unreleased dependency use and assuming SAP BTP or other
      SAP editions have the same capabilities.
    reviewed: '2026-11-24'
    owner: JAI erp extension engineering maintainers
