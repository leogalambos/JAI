sections:
  - id: landscape-fit
    delivery: required
    source: product
    text: Record the edition, business capability, system of record and interface ownership. Evaluate
      fit against the tenant's released scope and localization before choosing configuration or extension.
    applicability: SAP Cloud ERP, also documented as SAP S/4HANA Cloud Public Edition. Qualify the actual
      tenant and enabled scope.
    exclusions: Private Edition, on-premises SAP S/4HANA, unrelated SAP suites and assumed cross-edition
      parity.
    reviewed: '2026-11-24'
    owner: JAI enterprise applications architecture maintainers
  - id: extension-boundary
    delivery: required
    source: extensibility
    text: Compare standard fit, key-user and developer extensibility and side-by-side extensions against
      lifecycle, data ownership and operating responsibilities. Pin released interfaces and record the
      rationale and upgrade impact.
    applicability: SAP Cloud ERP, also documented as SAP S/4HANA Cloud Public Edition. Qualify the actual
      tenant and enabled scope.
    exclusions: Private Edition, on-premises SAP S/4HANA, unrelated SAP suites and assumed cross-edition
      parity.
    reviewed: '2026-11-24'
    owner: JAI enterprise applications architecture maintainers
  - id: verification-reference
    delivery: optional
    source: product
    reference: enterprise-architecture-evidence.md
    read_when: Recheck the edition, release, localization, enabled business scope and interfaces when
      assessing capability fit, extensibility or an upgrade.
