schema_version: 1
id: products/cncf/open-policy-agent/rule-based-authorization
title: Open Policy Agent rule-based authorization
version: 1.0.0
includes: []
applicability: Open Policy Agent 1.x authorization integration, reviewed against upstream v1.22.4
  and documentation.
sections:
- id: decision-contract
  delivery: required
  text: Pin the caller, decision path and input/result schema. The enforcement caller consumes the
    OPA decision. Test enforcement for allowed, denied and undefined results, evaluator errors and
    timeouts against the approved fail behavior.
  source: opa-integration
  applicability: Open Policy Agent 1.x authorization integration, reviewed against upstream v1.22.4
    and documentation.
  exclusions: Relation-tuple authorization, unverified legacy Rego behavior and deployment-specific
    commercial support.
  owner: JAI IAM engineering maintainers
  reviewed: '2026-11-23'
- id: decision-evidence
  delivery: required
  text: Link observed decisions to the active policy revision and the decision identifier when available.
    Verify that sensitive decision input and result fields are excluded or masked in authorized
    telemetry.
  source: opa-decision-logs
  applicability: Open Policy Agent 1.x authorization integration, reviewed against upstream v1.22.4
    and documentation.
  exclusions: Relation-tuple authorization, unverified legacy Rego behavior and deployment-specific
    commercial support.
  owner: JAI IAM engineering maintainers
  reviewed: '2026-11-23'
- id: policy-operations-reference
  delivery: optional
  reference: policy-operations-evidence.md
  read_when: Evaluating evaluator integration, bundle rollout, version compatibility or decision telemetry.
  source: opa-bundles
  applicability: Open Policy Agent 1.x authorization integration, reviewed against upstream v1.22.4
    and documentation.
  exclusions: Relation-tuple authorization, unverified legacy Rego behavior and deployment-specific
    commercial support.
  owner: JAI IAM engineering maintainers
  reviewed: '2026-11-23'
