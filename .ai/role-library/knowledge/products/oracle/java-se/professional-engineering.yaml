  classification:
    reviewer: Codebase Reviewer (reviewed applicability assessment)
    rule_version: 1
    binding_sha256: db7aed7c8540b4f9269aea8cb4c7b5d974f029bf1ef369da8e0c0355cf358c83
- id: efficient-java
  delivery: required
  source: performance
  text: Avoid unnecessary allocation, redundant scans and avoidable I/O. Use suitable algorithms and data structures.
    Validate performance-sensitive claims with a representative workload and a pinned runtime, using measurement
    and profiling when they inform the decision.
  applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation is
    a reference baseline; use matching release documentation and confirm vendor support.
  exclusions: Unverified performance claims or measurements from an unrepresentative target.
  reviewed: '2026-11-24'
  owner: JAI software engineering maintainers
