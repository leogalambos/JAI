schema_version: 1
id: products/oracle/java-se/professional-engineering
title: Java SE professional engineering
version: 1.0.0
includes: []
applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation
  is a reference baseline; use matching release documentation and confirm vendor support.
sections:
  - id: javadoc-contract
    delivery: required
    source: javadoc
    text: Use conventional multiline Javadoc blocks. Never compress a multiline block comment into one
      line. Document the purpose, every value and type parameter, applicable exceptions and their conditions,
      and non-void return semantics for public and protected methods and other significant methods.
      Use @param, @throws and @return where applicable. Inherit documentation only when it fully describes
      the implementation.
    applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation
      is a reference baseline; use matching release documentation and confirm vendor support.
    exclusions: Unapproved preview features, unverified performance claims and inferred portability
      of vendor support terms.
    reviewed: '2026-11-24'
    owner: JAI software engineering maintainers
  - id: readable-language
    delivery: required
    source: language
    text: Declare explicit local variable types. Do not use var to infer local types. The generic diamond
      operator <> is allowed where the surrounding declaration makes the type clear. Use other language
      features only where compatible with the declared target and readable in context.
    applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation
      is a reference baseline; use matching release documentation and confirm vendor support.
    exclusions: Unapproved preview features, unverified performance claims and inferred portability
      of vendor support terms.
    reviewed: '2026-11-24'
    owner: JAI software engineering maintainers
  - id: jdk-logging
    delivery: required
    source: logging
    text: Prefer the JDK's java.util.logging (JUL). Use another logging API only when explicitly required
      by the assignment. Choose meaningful levels and avoid disclosing sensitive data in log records.
    applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation
      is a reference baseline; use matching release documentation and confirm vendor support.
    exclusions: Unapproved preview features, unverified performance claims and inferred portability
      of vendor support terms.
    reviewed: '2026-11-24'
    owner: JAI software engineering maintainers
  - id: target-aware-conventions
    delivery: required
    source: conventions
    text: Apply relevant published Sun or Oracle guidance for naming, layout, documentation, API design
      and implementation. Treat historical conventions as historical; check target-release guidance
      and obey the standing JAI readability rules.
    applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation
      is a reference baseline; use matching release documentation and confirm vendor support.
    exclusions: Unapproved preview features, unverified performance claims and inferred portability
      of vendor support terms.
    reviewed: '2026-11-24'
    owner: JAI software engineering maintainers
  - id: efficient-java
    delivery: required
    source: performance
    text: Avoid unnecessary allocation, redundant scans and avoidable I/O. Use suitable algorithms and
      data structures. Validate performance-sensitive claims with a representative workload and a pinned
      runtime, using measurement and profiling when they inform the decision.
    applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation
      is a reference baseline; use matching release documentation and confirm vendor support.
    exclusions: Unapproved preview features, unverified performance claims and inferred portability
      of vendor support terms.
    reviewed: '2026-11-24'
    owner: JAI software engineering maintainers
  - id: verification-reference
    delivery: optional
    source: javadoc
    reference: professional-engineering-evidence.md
    read_when: Recheck when Java language level, JDK distribution, public API, logging requirements
      or performance-sensitive workload changes.
    applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation
      is a reference baseline; use matching release documentation and confirm vendor support.
    exclusions: Unapproved preview features, unverified performance claims and inferred portability
      of vendor support terms.
    reviewed: '2026-11-24'
    owner: JAI software engineering maintainers
