title: Java SE professional engineering
version: 1.0.0
includes: []
applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation is a
  reference baseline; use matching release documentation and confirm vendor support.
sections:
- id: javadoc-contract
  delivery: required
  source: javadoc
  text: Use conventional multiline Javadoc blocks. Never compress a multiline block comment into one line. Document
    the purpose, every value and type parameter, applicable exceptions and their conditions, and non-void return
    semantics for public and protected methods and other significant methods. Use @param, @throws and @return where
    applicable. Inherit documentation only when it fully describes the implementation.
  applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation is
    a reference baseline; use matching release documentation and confirm vendor support.
  exclusions: Unverified doclet behavior or assumed documentation coverage.
  reviewed: '2026-11-24'
  owner: JAI software engineering maintainers
  scope:
    product:
    - java-se
    activity:
    - java-api-documentation
  classification:
    reviewer: Codebase Reviewer (reviewed applicability assessment)
    rule_version: 1
    binding_sha256: 96de1e627efbd9d15a2e0ad4de4ea9e1d73d0a2ed2c04d15a5aa54bc2d5dc0f4
- id: readable-language
  delivery: required
  source: language
  text: Declare explicit local variable types. Do not use var to infer local types. The generic diamond operator
    <> is allowed where the surrounding declaration makes the type clear. Use other language features only where
    compatible with the declared target and readable in context.
  applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation is
    a reference baseline; use matching release documentation and confirm vendor support.
  exclusions: Unapproved preview features and syntax above the declared language level.
  reviewed: '2026-11-24'
  owner: JAI software engineering maintainers
  scope:
    product:
    - java-se
    activity:
    - java-implementation
  classification:
    reviewer: Codebase Reviewer (reviewed applicability assessment)
    rule_version: 1
    binding_sha256: 3df6eb11144d648eae70b5c6e00843c88de3072a79f2cf75f011b419f1b3db41
- id: jdk-logging
  delivery: required
  source: logging
  text: Prefer the JDK's java.util.logging (JUL). Use another logging API only when explicitly required by the assignment.
    Choose meaningful levels and avoid disclosing sensitive data in log records.
  applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation is
    a reference baseline; use matching release documentation and confirm vendor support.
  exclusions: Unverified logging behavior and disclosure of sensitive diagnostic data.
  reviewed: '2026-11-24'
  owner: JAI software engineering maintainers
  scope:
    product:
    - java-se
    activity:
    - java-logging
  classification:
    reviewer: Codebase Reviewer (reviewed applicability assessment)
    rule_version: 1
    binding_sha256: c68b65a1e8fa23912bb213dd3b977b58a4efb5731cfa9155c15cfb1c1bb5e72d
- id: target-aware-conventions
  delivery: required
  source: conventions
  text: Apply relevant published Sun or Oracle guidance for naming, layout, documentation, API design and implementation.
    Treat historical conventions as historical; check target-release guidance and obey the standing JAI readability
    rules.
  applicability: Java SE code on the project's declared Java and JDK target. Oracle Java SE 25 documentation is
    a reference baseline; use matching release documentation and confirm vendor support.
  exclusions: Unapproved preview features and inferred support portability.
  reviewed: '2026-11-24'
  owner: JAI software engineering maintainers
  scope:
    product:
    - java-se
    activity:
    - java-api-design
