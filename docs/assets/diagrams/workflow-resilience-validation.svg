<title id="workflow-resilience-validation-title">Resilience validation</title>
<desc id="workflow-resilience-validation-description">Business criticality, dependencies and recovery objectives are validated through exercised failure scenarios, findings are remediated and retested, and residual resilience risk is accepted by the correct authority. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-resilience-validation-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Resilience validation</text>
<path d="M318,194 L346,194" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<path d="M642,194 L670,194" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<path d="M822,288 L822,336" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<path d="M678,440 L650,440" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<path d="M354,440 L326,440" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<path d="M174,534 L174,582" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<path d="M318,686 L346,686" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<path d="M642,686 L670,686" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<path d="M822,780 L822,828" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-resilience-validation-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Business Continuity</text>
<text x="46" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">confirms business criticality,</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">impact tolerances and priority</text>
<text x="46" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">services/ processes</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Operational and</text>
<text x="370" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Technology Resilience</text>
<text x="370" y="177" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Architect</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">maps technical/ supplier/ data</text>
<text x="370" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">dependencies and correlated</text>
<text x="370" y="262" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">failure domains</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Disaster Recovery</text>
<text x="694" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Coordinator</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">validates RTO/ RPO and</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">recovery sequencing against</text>
<text x="694" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">dependency reality</text>
</g>
<g data-step="4"><rect x="678" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Operational and</text>
<text x="694" y="399" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Technology Resilience</text>
<text x="694" y="423" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Architect</text>
<text x="694" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines resilience/ recovery</text>
<text x="694" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">architecture and degradation</text>
<text x="694" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">patterns</text>
</g>
<g data-step="5"><rect x="354" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Test Manager</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">builds the exercise plan,</text>
<text x="370" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">entry/ exit criteria, injects</text>
<text x="370" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and evidence capture method</text>
</g>
<g data-step="6"><rect x="30" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Chaos and Resilience</text>
<text x="46" y="399" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Engineer</text>
<text x="46" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">executes authorised failure</text>
<text x="46" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">experiments/ exercises and</text>
<text x="46" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">captures telemetry</text>
</g>
<g data-step="7"><rect x="30" y="592" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Control Tester</text>
<text x="46" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">independently evaluates</text>
<text x="46" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">evidence and records control/</text>
<text x="46" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">resilience findings</text>
</g>
<g data-step="8"><rect x="354" y="592" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Operational and</text>
<text x="370" y="645" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Technology Resilience</text>
<text x="370" y="669" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Architect</text>
<text x="370" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">coordinates owned remediation</text>
<text x="370" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">across architecture,</text>
<text x="370" y="754" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">operations and suppliers</text>
</g>
<g data-step="9"><rect x="678" y="592" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Test Manager</text>
<text x="694" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">retests failed claims after</text>
<text x="694" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">remediation using comparable</text>
<text x="694" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">criteria</text>
</g>
<g data-step="10"><rect x="678" y="838" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="867" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. IT Service Owner</text>
<text x="694" y="904" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accepts demonstrated</text>
<text x="694" y="928" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">resilience or explicitly</text>
<text x="694" y="952" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accepts residual risk within</text>
<text x="694" y="976" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">authority</text>
</g>
</svg>
