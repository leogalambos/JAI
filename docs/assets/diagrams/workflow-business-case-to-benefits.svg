<title id="workflow-business-case-to-benefits-title">Business case to realised benefits</title>
<desc id="workflow-business-case-to-benefits-description">Benefits are baselined, owned, measured after go-live and used for continue/correct/close decisions. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-business-case-to-benefits-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Business case to realised benefits</text>
<path d="M318,182 L346,182" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-business-case-to-benefits-arrow)"/>
<path d="M642,182 L670,182" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-business-case-to-benefits-arrow)"/>
<path d="M822,264 L822,312" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-business-case-to-benefits-arrow)"/>
<path d="M678,404 L650,404" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-business-case-to-benefits-arrow)"/>
<path d="M354,404 L326,404" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-business-case-to-benefits-arrow)"/>
<path d="M174,486 L174,534" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-business-case-to-benefits-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Portfolio Manager</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">qualifies the investment</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">against strategy, capacity and</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">funding constraints</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Business Analyst</text>
<text x="370" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">makes the problem, scope,</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assumptions and outcome</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">measures testable</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Benefits Realisation</text>
<text x="694" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">turns the case into owned</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">benefits with baselines,</text>
<text x="694" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">targets and dependencies</text>
</g>
<g data-step="4"><rect x="678" y="322" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Product Manager</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">aligns product outcomes and</text>
<text x="694" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">roadmap to the benefit</text>
<text x="694" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">hypotheses</text>
</g>
<g data-step="5"><rect x="354" y="322" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Organisational Change and</text>
<text x="370" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Adoption Manager</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines adoption dependencies</text>
<text x="370" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and measures behavioural</text>
<text x="370" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">readiness</text>
</g>
<g data-step="6"><rect x="30" y="322" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Product Analyst</text>
<text x="46" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">measures post-go-live outcomes</text>
<text x="46" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">from the agreed sources</text>
</g>
<g data-step="7"><rect x="30" y="544" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="573" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Benefits Realisation</text>
<text x="46" y="597" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="46" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">compares actuals to the</text>
<text x="46" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">approved case and recommends</text>
<text x="46" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">action</text>
</g>
</svg>
