<title id="gen2-layers-title">Gen2 layers, local work and neighbouring handoffs</title>
<desc id="gen2-layers-description">L0 is external human authority. Work descends through six SABSA content perspectives. Findings and handoffs return through adjacent ownership. Management is crosscutting across the lifecycle.</desc>
<defs><marker id="gen2-layers-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Gen2 layers, local work and neighbouring handoffs</text>
<rect x="260" y="90" width="476" height="100" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="276" y="119" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">L0: external human authority</text>
<text x="276" y="152" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Reserved decisions and changes to human</text>
<text x="276" y="176" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">requirements.</text>
<path d="M498,190 L498,215" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-layers-arrow)"/>
<rect x="260" y="225" width="476" height="82" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="276" y="254" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">L1 Contextual</text>
<text x="276" y="287" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Business purpose, scope and required qualities</text>
<path d="M498,307 L498,321" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-layers-arrow)"/>
<rect x="260" y="323" width="476" height="82" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="276" y="352" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">L2 Conceptual</text>
<text x="276" y="385" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Principles, domains and control objectives</text>
<path d="M498,405 L498,419" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-layers-arrow)"/>
<rect x="260" y="421" width="476" height="82" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="276" y="450" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">L3 Logical</text>
<text x="276" y="483" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Services, information and control behaviour</text>
<path d="M498,503 L498,517" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-layers-arrow)"/>
<rect x="260" y="519" width="476" height="82" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="276" y="548" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">L4 Physical</text>
<text x="276" y="581" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Concrete technical and organisational mechanisms</text>
<path d="M498,601 L498,615" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-layers-arrow)"/>
<rect x="260" y="617" width="476" height="82" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="276" y="646" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">L5 Component</text>
<text x="276" y="679" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Components, configuration and implementation</text>
<path d="M498,699 L498,713" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-layers-arrow)"/>
<rect x="260" y="715" width="476" height="82" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="276" y="744" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">L6 Management</text>
<text x="276" y="777" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Operation, assurance and lifecycle improvement</text>
<path d="M160,230 L160,810" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-layers-arrow)"/>
<text x="30" y="345" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Requirements</text>
<text x="30" y="369" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">and agreed</text>
<text x="30" y="393" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">inputs descend</text>
<path d="M840,810 L840,230" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-layers-arrow)"/>
<text x="855" y="345" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Findings and</text>
<text x="855" y="369" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">reviewed</text>
<text x="855" y="393" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">handoffs</text>
<text x="855" y="417" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">return</text>
<text x="32" y="872" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Each layer addresses What, Why, How, Who, Where and When.</text>
<text x="32" y="900" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Management concerns inform every perspective; no lower layer rewrites its neighbour’s inputs.</text>
</svg>
