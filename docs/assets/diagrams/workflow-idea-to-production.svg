<title id="workflow-idea-to-production-title">Idea to production</title>
<desc id="workflow-idea-to-production-description">A change running in production with a measured benefit and a named owner. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-idea-to-production-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Idea to production</text>
<path d="M318,170 L346,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M642,170 L670,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M822,240 L822,288" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M678,356 L650,356" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M354,356 L326,356" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M174,414 L174,462" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M318,530 L346,530" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M642,530 L670,530" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M822,588 L822,636" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M678,716 L650,716" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M354,716 L326,716" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<path d="M174,786 L174,834" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-idea-to-production-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Business Relationship</text>
<text x="46" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">captures the demand with a</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">business outcome and an owner</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Product Manager</text>
<text x="370" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decides whether and why to</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">pursue it, against evidence</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Business Analyst</text>
<text x="694" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">elicits and specifies the need</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">with testable acceptance</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">criteria</text>
</g>
<g data-step="4"><rect x="678" y="298" width="288" height="116" rx="12" fill="#145776"/>
<text x="694" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Solution Architect</text>
<text x="694" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">designs the solution end to</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">end and records the decisions</text>
</g>
<g data-step="5"><rect x="354" y="298" width="288" height="116" rx="12" fill="#145776"/>
<text x="370" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Security Architect</text>
<text x="370" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">designs the controls the</text>
<text x="370" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">solution needs</text>
</g>
<g data-step="6"><rect x="30" y="298" width="288" height="116" rx="12" fill="#145776"/>
<text x="46" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Technical Lead</text>
<text x="46" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">breaks the work down and sets</text>
<text x="46" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">the technical approach</text>
</g>
<g data-step="7"><rect x="30" y="472" width="288" height="116" rx="12" fill="#145776"/>
<text x="46" y="501" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Software Engineer</text>
<text x="46" y="538" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">implements with tests and</text>
<text x="46" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">telemetry</text>
</g>
<g data-step="8"><rect x="354" y="472" width="288" height="116" rx="12" fill="#145776"/>
<text x="370" y="501" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Test Analyst</text>
<text x="370" y="538" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">verifies against the claims</text>
<text x="370" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and reports residual risk</text>
</g>
<g data-step="9"><rect x="678" y="472" width="288" height="116" rx="12" fill="#145776"/>
<text x="694" y="501" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Release Engineer</text>
<text x="694" y="538" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assembles the release and</text>
<text x="694" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">proves the rollback</text>
</g>
<g data-step="10"><rect x="678" y="646" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="675" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. Change Manager</text>
<text x="694" y="712" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">authorises the production</text>
<text x="694" y="736" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">change proportionate to its</text>
<text x="694" y="760" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">risk</text>
</g>
<g data-step="11"><rect x="354" y="646" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="675" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">11. GitOps and Continuous</text>
<text x="370" y="699" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Delivery Engineer</text>
<text x="370" y="736" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">promotes the artefact and runs</text>
<text x="370" y="760" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">the progressive rollout</text>
</g>
<g data-step="12"><rect x="30" y="646" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="675" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">12. Site Reliability</text>
<text x="46" y="699" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Engineer</text>
<text x="46" y="736" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">observes against the service</text>
<text x="46" y="760" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">objective and owns the run</text>
</g>
<g data-step="13"><rect x="30" y="844" width="288" height="116" rx="12" fill="#145776"/>
<text x="46" y="873" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">13. Product Analyst</text>
<text x="46" y="910" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">measures whether the stated</text>
<text x="46" y="934" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">benefit arrived</text>
</g>
</svg>
