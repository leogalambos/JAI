<title id="workflow-demand-to-portfolio-to-funding-title">Demand to portfolio to funding</title>
<desc id="workflow-demand-to-portfolio-to-funding-description">Demand is traceable from intake through capability/architecture/risk/value assessment, sizing/capacity and prioritisation to an explicit funding/portfolio commitment decision. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-demand-to-portfolio-to-funding-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
