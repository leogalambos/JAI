<g data-step="9"><rect x="678" y="568" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="597" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. IT Financial Management /</text>
<text x="694" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">TBM Manager</text>
<text x="694" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">validates TCO/ funding profile</text>
<text x="694" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and financial comparability</text>
</g>
<g data-step="10"><rect x="678" y="790" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="819" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. Portfolio Manager</text>
<text x="694" y="856" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">makes or routes the delegated</text>
<text x="694" y="880" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">funding/ portfolio commitment</text>
<text x="694" y="904" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decision</text>
</g>
