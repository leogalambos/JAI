<svg xmlns="http://www.w3.org/2000/svg" class="ai-inline-diagram-svg" viewBox="0 0 996 626" role="img" aria-labelledby="workflow-semantic-to-enterprise-publication-title workflow-semantic-to-enterprise-publication-description">
