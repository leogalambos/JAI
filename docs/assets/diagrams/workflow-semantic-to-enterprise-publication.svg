<title id="workflow-semantic-to-enterprise-publication-title">Semantic artefact to enterprise publication</title>
<desc id="workflow-semantic-to-enterprise-publication-description">A released audience-specific publication whose semantic content is traceable to the approved source and has passed semantic and publication gates. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-semantic-to-enterprise-publication-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Semantic artefact to enterprise publication</text>
<path d="M318,218 L346,218" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-semantic-to-enterprise-publication-arrow)"/>
<path d="M642,218 L670,218" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-semantic-to-enterprise-publication-arrow)"/>
<path d="M822,336 L822,384" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-semantic-to-enterprise-publication-arrow)"/>
<path d="M678,476 L650,476" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-semantic-to-enterprise-publication-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="236" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Owning specialist</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">finalises claims, decisions,</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assumptions, evidence and</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">acceptance criteria</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="236" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Evidence &amp; Rationale</text>
<text x="370" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Reviewer</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">checks evidence strength,</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assumptions, alternatives,</text>
<text x="370" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">rationale and residual risk</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="236" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Enterprise Publication</text>
<text x="694" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Editor</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">selects the publication</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">archetype and renders</text>
<text x="694" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">audience-specific DOCX/ PPTX/</text>
<text x="694" y="262" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">XLSX/ HTML/ SVG outputs from</text>
<text x="694" y="286" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">the exact approved semantic</text>
<text x="694" y="310" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">snapshot</text>
</g>
<g data-step="4"><rect x="678" y="394" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="423" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Visual Quality Reviewer</text>
<text x="694" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">checks density, hierarchy,</text>
<text x="694" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">legibility, tables, diagrams,</text>
<text x="694" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">document control and package</text>
<text x="694" y="532" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">integrity</text>
</g>
<g data-step="5"><rect x="354" y="394" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="423" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Named authority</text>
<text x="370" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reviews completed semantic,</text>
<text x="370" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">publication and actual visual</text>
<text x="370" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">evidence and records the human</text>
<text x="370" y="532" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">release decision</text>
</g>
</svg>
