<svg xmlns="http://www.w3.org/2000/svg" class="ai-inline-diagram-svg" viewBox="0 0 996 776" role="img" aria-labelledby="workflow-design-to-operational-readiness-title workflow-design-to-operational-readiness-description">
<!-- SPDX-License-Identifier: BSD-4-Clause; Copyright (c) 2026 Leo Galambos and the Egothor team; https://www.egothor.org -->
<title id="workflow-design-to-operational-readiness-title">Design to operational readiness</title>
<desc id="workflow-design-to-operational-readiness-description">The receiving service organisation explicitly accepts an evidenced, supportable and recoverable service. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-design-to-operational-readiness-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Design to operational readiness</text>
<path d="M318,194 L346,194" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-design-to-operational-readiness-arrow)"/>
<path d="M642,194 L670,194" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-design-to-operational-readiness-arrow)"/>
<path d="M822,288 L822,336" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-design-to-operational-readiness-arrow)"/>
<path d="M678,440 L650,440" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-design-to-operational-readiness-arrow)"/>
<path d="M354,440 L326,440" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-design-to-operational-readiness-arrow)"/>
<path d="M174,534 L174,582" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-design-to-operational-readiness-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Solution Architect</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines the target</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">architecture, NFRs,</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">dependencies and failure modes</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Security Architect</text>
<text x="370" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines security controls and</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">residual security risks</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Operational and</text>
<text x="694" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Technology Resilience</text>
<text x="694" y="177" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Architect</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">tests the design against</text>
<text x="694" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">failure domains, impact</text>
<text x="694" y="262" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">tolerances and recovery paths</text>
</g>
<g data-step="4"><rect x="678" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Site Reliability Engineer</text>
<text x="694" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines SLOs, observability,</text>
<text x="694" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">alerting and operability</text>
<text x="694" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">signals</text>
</g>
<g data-step="5"><rect x="354" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Service Transition and</text>
<text x="370" y="399" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Operational Readiness</text>
<text x="370" y="423" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="370" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assembles and assesses</text>
<text x="370" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">operational acceptance</text>
<text x="370" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">evidence</text>
</g>
<g data-step="6"><rect x="30" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Change Manager</text>
<text x="46" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">checks the production change</text>
<text x="46" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">path and risk-class approval</text>
</g>
<g data-step="7"><rect x="30" y="592" width="288" height="116" rx="12" fill="#145776"/>
<text x="46" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. IT Service Owner</text>
<text x="46" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accepts service ownership and</text>
<text x="46" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">residual operational risk</text>
</g>
</svg>
