<g data-step="7"><rect x="30" y="568" width="288" height="236" rx="12" fill="#145776"/>
<text x="46" y="597" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Secure Delivery /</text>
<text x="46" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">DevSecOps Architect</text>
<text x="46" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">checks that release</text>
<text x="46" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">provenance, pipeline controls,</text>
<text x="46" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">policy-as-code and software</text>
<text x="46" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">supply-chain evidence conform</text>
<text x="46" y="754" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">to the approved</text>
<text x="46" y="778" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">secure-delivery architecture</text>
