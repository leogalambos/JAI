<text x="370" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">independently checks mandatory</text>
<text x="370" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">release criteria and evidence</text>
</g>
<g data-step="9"><rect x="678" y="568" width="288" height="236" rx="12" fill="#145776"/>
<text x="694" y="597" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Enterprise Release</text>
<text x="694" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="694" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">issues delegated integrated</text>
<text x="694" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">go/ no-go or routes decision</text>
<text x="694" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">to higher authority</text>
</g>
<g data-step="10"><rect x="678" y="862" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="891" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. Release Engineer</text>
<text x="694" y="928" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">executes the authorised</text>
<text x="694" y="952" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">technical release through</text>
<text x="694" y="976" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">controlled pipelines</text>
</g>
<g data-step="11"><rect x="354" y="862" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="891" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">11. Site Reliability</text>
<text x="370" y="915" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Engineer</text>
<text x="370" y="952" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">monitors agreed technical/</text>
<text x="370" y="976" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">service signals and triggers</text>
<text x="370" y="1000" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reversal if thresholds breach</text>
