<path d="M642,614 L670,614" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-regulatory-change-to-assurance-arrow)"/>
<path d="M822,684 L822,732" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-regulatory-change-to-assurance-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Compliance Officer</text>
<text x="46" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">(Technology)</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">records authoritative</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">regulatory change source,</text>
<text x="46" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">effective dates and scope</text>
<text x="46" y="262" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">hypotheses</text>
