<g data-step="8"><rect x="354" y="544" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="573" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Control Owner</text>
<text x="370" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">coordinates implementation</text>
<text x="370" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">evidence and control operating</text>
<text x="370" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">proof</text>
