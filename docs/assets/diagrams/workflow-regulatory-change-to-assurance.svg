<g data-step="9"><rect x="678" y="544" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="573" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Internal IT Auditor</text>
