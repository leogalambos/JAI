<title id="workflow-regulatory-change-to-assurance-title">Regulatory change to assurance</title>
<desc id="workflow-regulatory-change-to-assurance-description">Applicability and obligations are translated into traceable requirements/controls, architecture and remediation changes are implemented, evidence is independently assured, and closure is authorised. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-regulatory-change-to-assurance-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Regulatory change to assurance</text>
<path d="M318,194 L346,194" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-regulatory-change-to-assurance-arrow)"/>
