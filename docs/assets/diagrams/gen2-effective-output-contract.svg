<title id="gen2-contract-title">The effective output contract comes from explicit composition</title>
<desc id="gen2-contract-description">The selected role output and its shared foundations and overlays define the effective contract. A true condition requires content, a false condition permits justified non-applicability, and an unknown condition stays unresolved. Review and receiving acceptance remain separate.</desc>
<defs><marker id="gen2-contract-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">The effective output contract comes from explicit composition</text>
<rect x="30" y="95" width="280" height="170" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="46" y="124" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Exact role output</text>
<text x="46" y="157" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Purpose, required inputs</text>
<text x="46" y="181" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">and specialist obligations;</text>
<text x="46" y="205" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">select by registered</text>
<text x="46" y="229" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">contract identity.</text>
<rect x="358" y="95" width="280" height="170" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="374" y="124" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Shared foundations</text>
<text x="374" y="157" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Common required</text>
<text x="374" y="181" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">information, evidence</text>
<text x="374" y="205" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">duties and prohibited</text>
<text x="374" y="229" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">content.</text>
<rect x="686" y="95" width="280" height="170" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="702" y="124" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Bound overlays and context</text>
<text x="702" y="157" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Applicable specialisations</text>
<text x="702" y="181" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">and explicit conditional</text>
<text x="702" y="205" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">requirements.</text>
<path d="M170,265 L170,315 L498,315 L498,350" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-contract-arrow)"/>
<path d="M498,265 L498,350" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-contract-arrow)"/>
<path d="M826,265 L826,315 L498,315" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#gen2-contract-arrow)"/>
<rect x="260" y="360" width="476" height="120" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="276" y="389" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Effective contract for this output</text>
<text x="276" y="422" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Read all linked obligations together. Optional</text>
<text x="276" y="446" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">content does not replace required content.</text>
<rect x="30" y="550" width="280" height="160" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="46" y="579" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Condition = true</text>
<text x="46" y="612" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">The conditional information</text>
<text x="46" y="636" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">is required and needs</text>
<text x="46" y="660" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">supporting evidence.</text>
<rect x="358" y="550" width="280" height="160" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="374" y="579" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Condition = false</text>
<text x="374" y="612" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Document the justified</text>
<text x="374" y="636" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">non-applicability where</text>
<text x="374" y="660" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">required by the contract.</text>
<rect x="686" y="550" width="280" height="160" rx="12" fill="#e8f2f8" stroke="#a9c6d8"/>
<text x="702" y="579" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Condition = unknown</text>
<text x="702" y="612" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">Resolve the missing context</text>
<text x="702" y="636" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">or record a gap; do not</text>
<text x="702" y="660" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="400" text-anchor="start">treat unknown as false.</text>
<text x="32" y="777" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#102d43" font-weight="700" text-anchor="start">Author → independent review → exact workflow handoff; human acceptance remains separate.</text>
</svg>
