<svg xmlns="http://www.w3.org/2000/svg" class="ai-inline-diagram-svg" viewBox="0 0 996 680" role="img" aria-labelledby="workflow-codebase-takeover-title workflow-codebase-takeover-description">
<!-- SPDX-License-Identifier: BSD-4-Clause; Copyright (c) 2026 Leo Galambos and the Egothor team; https://www.egothor.org -->
<title id="workflow-codebase-takeover-title">Inherited codebase takeover</title>
<desc id="workflow-codebase-takeover-description">A reviewed, measured, supportable system with a sequenced improvement plan. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-codebase-takeover-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Inherited codebase takeover</text>
<path d="M318,170 L346,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-codebase-takeover-arrow)"/>
<path d="M642,170 L670,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-codebase-takeover-arrow)"/>
<path d="M822,240 L822,288" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-codebase-takeover-arrow)"/>
<path d="M678,368 L650,368" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-codebase-takeover-arrow)"/>
<path d="M354,368 L326,368" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-codebase-takeover-arrow)"/>
<path d="M174,438 L174,486" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-codebase-takeover-arrow)"/>
<path d="M318,554 L346,554" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-codebase-takeover-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Codebase Reviewer</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">audits against fixed criteria</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and reports prioritised</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">findings</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Application Architect</text>
<text x="370" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assesses structure and defines</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">module boundaries</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Test Architect</text>
<text x="694" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">establishes how the system can</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">be verified at all</text>
</g>
<g data-step="4"><rect x="678" y="298" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Software Modernisation</text>
<text x="694" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Engineer</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">captures existing behaviour</text>
<text x="694" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">before changing it</text>
</g>
<g data-step="5"><rect x="354" y="298" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Infrastructure as Code</text>
<text x="370" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Engineer</text>
<text x="370" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">codifies whatever it currently</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">runs on</text>
</g>
<g data-step="6"><rect x="30" y="298" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Observability Engineer</text>
<text x="46" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">makes its behaviour visible</text>
<text x="46" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">before changing it</text>
</g>
<g data-step="7"><rect x="30" y="496" width="288" height="116" rx="12" fill="#145776"/>
<text x="46" y="525" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Technical Lead</text>
<text x="46" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">sequences the work so each</text>
<text x="46" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">slice ships independently</text>
</g>
<g data-step="8"><rect x="354" y="496" width="288" height="116" rx="12" fill="#145776"/>
<text x="370" y="525" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. IT Service Owner</text>
<text x="370" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accepts ownership with a cost</text>
<text x="370" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and risk position</text>
</g>
</svg>
