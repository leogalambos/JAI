<title id="workflow-new-service-onboarding-title">New service onboarding</title>
<desc id="workflow-new-service-onboarding-description">A service with codified infrastructure, a pipeline, environments, observability and an on-call owner. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-new-service-onboarding-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">New service onboarding</text>
<path d="M318,170 L346,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M642,170 L670,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M822,240 L822,288" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M678,368 L650,368" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M354,368 L326,368" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M174,438 L174,486" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M318,566 L346,566" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M642,566 L670,566" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M822,636 L822,684" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M678,764 L650,764" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<path d="M354,764 L326,764" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-new-service-onboarding-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Cloud Architect</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">sets the landing zone,</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">resilience and residency</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">constraints</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Infrastructure as Code</text>
<text x="370" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Engineer</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">codifies the infrastructure</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and its guardrails</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Container Platform</text>
<text x="694" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Engineer</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">establishes the image build</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">chain and base image lineage</text>
</g>
<g data-step="4"><rect x="678" y="298" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. CI/ CD Platform Engineer</text>
<text x="694" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">wires the service onto the</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">shared pipeline platform</text>
</g>
<g data-step="5"><rect x="354" y="298" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Secrets and Configuration</text>
<text x="370" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Management Engineer</text>
<text x="370" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">issues the service&#x27;s</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">credentials with a lifecycle</text>
</g>
<g data-step="6"><rect x="30" y="298" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Environment Manager</text>
<text x="46" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">provisions the non-production</text>
<text x="46" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">environments and their data</text>
</g>
<g data-step="7"><rect x="30" y="496" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="525" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. GitOps and Continuous</text>
<text x="46" y="549" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Delivery Engineer</text>
<text x="46" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines promotion and rollback</text>
<text x="46" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">across environments</text>
</g>
<g data-step="8"><rect x="354" y="496" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="525" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Observability Engineer</text>
<text x="370" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">instruments the service</text>
<text x="370" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">against its objectives</text>
</g>
<g data-step="9"><rect x="678" y="496" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="525" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Site Reliability Engineer</text>
<text x="694" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">agrees the service objective</text>
<text x="694" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and the error budget policy</text>
</g>
<g data-step="10"><rect x="678" y="694" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="723" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. Application Support</text>
<text x="694" y="747" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Analyst</text>
<text x="694" y="784" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accepts the service into</text>
<text x="694" y="808" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">support with a runbook</text>
</g>
<g data-step="11"><rect x="354" y="694" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="723" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">11. Configuration Manager</text>
<text x="370" y="760" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">records the service, its</text>
<text x="370" y="784" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">relationships and its owner</text>
</g>
<g data-step="12"><rect x="30" y="694" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="723" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">12. IT Service Owner</text>
<text x="46" y="760" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">takes end-to-end ownership of</text>
<text x="46" y="784" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">value, cost and risk</text>
</g>
</svg>
