<svg xmlns="http://www.w3.org/2000/svg" class="ai-inline-diagram-svg" viewBox="0 0 996 1220" role="img" aria-labelledby="workflow-cyber-incident-breach-to-recovery-title workflow-cyber-incident-breach-to-recovery-description">
