<title id="workflow-cyber-incident-breach-to-recovery-title">Cyber incident / breach to recovery</title>
<desc id="workflow-cyber-incident-breach-to-recovery-description">The incident is contained and eradicated, evidence is preserved, recovery is accepted by the business, notification decisions are traceable, and control remediation is closed or owned. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-cyber-incident-breach-to-recovery-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Cyber incident / breach to recovery</text>
<path d="M318,170 L346,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M642,170 L670,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M822,240 L822,288" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M678,380 L650,380" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M354,380 L326,380" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M174,462 L174,510" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M318,614 L346,614" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M642,614 L670,614" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M822,708 L822,756" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M678,848 L650,848" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M354,848 L326,848" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<path d="M174,930 L174,978" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-cyber-incident-breach-to-recovery-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Security Analyst Tier 1</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">detects and records the alert/</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">incident with initial facts</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and provenance</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Incident Responder</text>
<text x="370" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">triages severity, scope,</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">likely attack path and</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">immediate priorities</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Incident Responder</text>
<text x="694" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">contains affected assets/</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accounts while preserving</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reversibility and evidence</text>
</g>
<g data-step="4"><rect x="678" y="298" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Digital Forensics</text>
<text x="694" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Examiner</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">preserves and validates</text>
<text x="694" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">forensic evidence, chain of</text>
<text x="694" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">custody and timeline facts</text>
</g>
<g data-step="5"><rect x="354" y="298" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. IT Risk Manager</text>
<text x="370" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assesses business, service,</text>
<text x="370" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">security and regulatory impact</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">using verified facts</text>
</g>
<g data-step="6"><rect x="30" y="298" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Data Protection Officer</text>
<text x="46" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">performs privacy/ breach</text>
<text x="46" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assessment and coordinates</text>
<text x="46" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">legal/ regulatory decision</text>
<text x="46" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">inputs</text>
</g>
<g data-step="7"><rect x="30" y="520" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="549" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Incident Responder</text>
<text x="46" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">eradicates malicious</text>
<text x="46" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">persistence/ root causes and</text>
<text x="46" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">verifies the environment</text>
</g>
<g data-step="8"><rect x="354" y="520" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="549" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Disaster Recovery</text>
<text x="370" y="573" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Coordinator</text>
<text x="370" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">coordinates recovery</text>
<text x="370" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">sequencing, integrity</text>
<text x="370" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">validation and rollback/</text>
<text x="370" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">fallback readiness</text>
</g>
<g data-step="9"><rect x="678" y="520" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="549" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. IT Service Owner</text>
<text x="694" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">validates business/ service</text>
<text x="694" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">recovery and accepts restored</text>
<text x="694" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">operating state</text>
</g>
<g data-step="10"><rect x="678" y="766" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="795" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. Crisis Manager</text>
<text x="694" y="832" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">coordinates customer/</text>
<text x="694" y="856" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">regulator/ executive</text>
<text x="694" y="880" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">communications decision and</text>
<text x="694" y="904" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">timing where required</text>
</g>
<g data-step="11"><rect x="354" y="766" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="795" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">11. Problem Manager</text>
<text x="370" y="832" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">runs lessons learned/</text>
<text x="370" y="856" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">root-cause analysis across</text>
<text x="370" y="880" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">people/ process/ technology</text>
</g>
<g data-step="12"><rect x="30" y="766" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="795" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">12. Control Owner</text>
<text x="46" y="832" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">owns control remediation,</text>
<text x="46" y="856" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">target dates and evidence of</text>
<text x="46" y="880" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">completion</text>
</g>
<g data-step="13"><rect x="30" y="988" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="1017" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">13. Internal IT Auditor</text>
<text x="46" y="1054" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">independently verifies closure</text>
<text x="46" y="1078" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">evidence for material</text>
<text x="46" y="1102" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">incidents where governance</text>
<text x="46" y="1126" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">requires</text>
</g>
</svg>
