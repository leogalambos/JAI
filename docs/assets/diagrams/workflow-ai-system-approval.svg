<title id="t">AI system from idea to approved production use</title>
<desc id="d">An AI system classified, assessed, monitored, and accountable to a named human.</desc>
<rect width="100%" height="100%" rx="24" fill="#f6fafc" stroke="#d6e6ee"/>
<text x="42" y="38" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0b1f33">AI system from idea to approved production use</text>
