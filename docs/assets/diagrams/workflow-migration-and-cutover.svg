<title id="workflow-migration-and-cutover-title">Migration and cutover</title>
<desc id="workflow-migration-and-cutover-description">Migration completes with reconciled data, controlled rollback boundaries, operational acceptance and owned residual defects. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-migration-and-cutover-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Migration and cutover</text>
<path d="M318,182 L346,182" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M642,182 L670,182" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M822,264 L822,312" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M678,416 L650,416" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M354,416 L326,416" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M174,510 L174,558" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M318,662 L346,662" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M642,662 L670,662" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M822,756 L822,804" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<path d="M678,896 L650,896" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-migration-and-cutover-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Data Architect</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines source/ target models,</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">authoritative ownership and</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">data constraints</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Data Migration and</text>
<text x="370" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Cutover Lead</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">builds migration strategy,</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reconciliation rules and</text>
<text x="370" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">integrated cutover sequence</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Data Engineer</text>
<text x="694" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">implements and rehearses</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">candidate migration pipelines</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">in the explicitly permitted</text>
<text x="694" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">pre-production environment</text>
</g>
<g data-step="4"><rect x="678" y="322" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Test Manager</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">independently assesses</text>
<text x="694" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">migration, reconciliation and</text>
<text x="694" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">business acceptance evidence</text>
</g>
<g data-step="5"><rect x="354" y="322" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Service Transition and</text>
<text x="370" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Operational Readiness</text>
<text x="370" y="399" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="370" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">confirms monitoring, support,</text>
<text x="370" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">recovery and receiving-team</text>
<text x="370" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">readiness</text>
</g>
<g data-step="6"><rect x="30" y="322" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Release Engineer</text>
<text x="46" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">prepares the candidate release</text>
<text x="46" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">manifest and rehearses</text>
<text x="46" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">deployment and rollback within</text>
<text x="46" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">the permitted pre-production</text>
<text x="46" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">scope</text>
</g>
<g data-step="7"><rect x="30" y="568" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="597" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Change Manager</text>
<text x="46" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">obtains the named human</text>
<text x="46" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decision for the production</text>
<text x="46" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">window and stop/ go governance</text>
</g>
<g data-step="8"><rect x="354" y="568" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="597" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Data Engineer</text>
<text x="370" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">executes the approved</text>
<text x="370" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">production cutover with the</text>
<text x="370" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">release operator and records</text>
<text x="370" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reconciliation and rollback</text>
<text x="370" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">observations</text>
</g>
<g data-step="9"><rect x="678" y="568" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="597" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Test Analyst</text>
<text x="694" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">performs independent actual</text>
<text x="694" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">post-cutover validation of</text>
<text x="694" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reconciliation, service</text>
<text x="694" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">behaviour and stability</text>
<text x="694" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">against predeclared criteria</text>
</g>
<g data-step="10"><rect x="678" y="814" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="843" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. Test Manager</text>
<text x="694" y="880" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assesses independent</text>
<text x="694" y="904" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">post-cutover validation,</text>
<text x="694" y="928" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reconciliation and stability</text>
<text x="694" y="952" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">evidence</text>
</g>
<g data-step="11"><rect x="354" y="814" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="843" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">11. IT Service Owner</text>
<text x="370" y="880" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accepts the migrated service</text>
<text x="370" y="904" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">after stability and</text>
<text x="370" y="928" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reconciliation checks</text>
</g>
</svg>
