<title id="workflow-source-to-contract-to-service-title">Source to contract to service</title>
<desc id="workflow-source-to-contract-to-service-description">The selected supplier/service has evidence-backed fit, enforceable contract obligations, approved implementation and operational acceptance, with ongoing vendor governance. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-source-to-contract-to-service-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Source to contract to service</text>
<path d="M318,170 L346,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<path d="M642,170 L670,170" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<path d="M822,240 L822,288" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<path d="M678,380 L650,380" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<path d="M354,380 L326,380" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<path d="M174,462 L174,510" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<path d="M318,614 L346,614" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<path d="M642,614 L670,614" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<path d="M822,708 L822,756" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-source-to-contract-to-service-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Business Analyst</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">turns business/ service need</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">into outcome, requirement and</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">acceptance baseline</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. IT Procurement Specialist</text>
<text x="370" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">creates and runs RFI/ RFP</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">process with comparable</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">response structure</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="140" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Vendor Manager</text>
<text x="694" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assesses supplier capability,</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">viability, support and</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">governance fit</text>
</g>
<g data-step="4"><rect x="678" y="298" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Third-Party Risk Manager</text>
<text x="694" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">coordinates security/ privacy/</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">resilience risk assessment</text>
<text x="694" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">with specialist authorities</text>
</g>
<g data-step="5"><rect x="354" y="298" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Enterprise Applications</text>
<text x="370" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Architect</text>
<text x="370" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">assesses architecture/</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">capability/ integration fit</text>
<text x="370" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and lock-in/ exit implications</text>
</g>
<g data-step="6"><rect x="30" y="298" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="327" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. IT Procurement Specialist</text>
<text x="46" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">runs weighted selection and</text>
<text x="46" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">records rationale/ conflicts</text>
</g>
<g data-step="7"><rect x="30" y="520" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="549" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Contract Manager</text>
<text x="46" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">translates agreed service/</text>
<text x="46" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">security/ privacy/ resilience/</text>
<text x="46" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">exit controls into enforceable</text>
<text x="46" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">clauses/ schedules</text>
</g>
<g data-step="8"><rect x="354" y="520" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="549" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Implementation Consultant</text>
<text x="370" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">coordinates implementation</text>
<text x="370" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">against contract/ design</text>
<text x="370" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">acceptance criteria</text>
</g>
<g data-step="9"><rect x="678" y="520" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="549" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Service Transition and</text>
<text x="694" y="573" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Operational Readiness</text>
<text x="694" y="597" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="694" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">validates support, monitoring,</text>
<text x="694" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">CMDB, DR, security, ownership</text>
<text x="694" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and service acceptance</text>
</g>
<g data-step="10"><rect x="678" y="766" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="795" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. Vendor Manager</text>
<text x="694" y="832" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">establishes ongoing</text>
<text x="694" y="856" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">performance, risk,</text>
<text x="694" y="880" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">improvement, renewal and exit</text>
<text x="694" y="904" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">governance</text>
</g>
</svg>
