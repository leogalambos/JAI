<title id="workflow-siam-multi-supplier-title">SIAM / multi-supplier service integration</title>
<desc id="workflow-siam-multi-supplier-description">One governed service-integration model joins supplier responsibilities into end-to-end service outcomes with measurable SLAs/OLAs, clear process ownership and cross-supplier escalation. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-siam-multi-supplier-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">SIAM / multi-supplier service integration</text>
<path d="M318,182 L346,182" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-siam-multi-supplier-arrow)"/>
<path d="M642,182 L670,182" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-siam-multi-supplier-arrow)"/>
<path d="M822,264 L822,312" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-siam-multi-supplier-arrow)"/>
<path d="M678,404 L650,404" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-siam-multi-supplier-arrow)"/>
<path d="M354,404 L326,404" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-siam-multi-supplier-arrow)"/>
<path d="M174,486 L174,534" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-siam-multi-supplier-arrow)"/>
<path d="M318,614 L346,614" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-siam-multi-supplier-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. SIAM Manager</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines end-to-end service</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">scope, integrator authority</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and supplier responsibility</text>
<text x="46" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">model</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Service Level Manager</text>
<text x="370" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decomposes customer SLA into</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">measurable OLAs/ underpinning</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">supplier obligations</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Architecture Repository</text>
<text x="694" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">and Modelling Lead</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">maintains cross-supplier</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">service/ technology/</text>
<text x="694" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">dependency model</text>
</g>
<g data-step="4"><rect x="678" y="322" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Incident Manager</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines cross-supplier</text>
<text x="694" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">incident ownership, bridge,</text>
<text x="694" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">evidence and handoff rules</text>
</g>
<g data-step="5"><rect x="354" y="322" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Problem Manager</text>
<text x="370" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">owns systemic problem process</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">across supplier boundaries</text>
</g>
<g data-step="6"><rect x="30" y="322" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Enterprise Release</text>
<text x="46" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="46" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">integrates supplier change/</text>
<text x="46" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">release windows, collisions</text>
<text x="46" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and readiness</text>
</g>
<g data-step="7"><rect x="30" y="544" width="288" height="140" rx="12" fill="#145776"/>
<text x="46" y="573" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. SIAM Manager</text>
<text x="46" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">defines dispute/ escalation</text>
<text x="46" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">clocks, evidence standard and</text>
<text x="46" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decision authority</text>
</g>
<g data-step="8"><rect x="354" y="544" width="288" height="140" rx="12" fill="#145776"/>
<text x="370" y="573" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. IT Service Owner</text>
<text x="370" y="610" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accepts the integrated service</text>
<text x="370" y="634" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and residual multi-supplier</text>
<text x="370" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">risks</text>
</g>
</svg>
