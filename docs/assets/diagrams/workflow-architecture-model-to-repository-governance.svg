<title id="workflow-architecture-model-to-repository-governance-title">Architecture model to repository governance</title>
<desc id="workflow-architecture-model-to-repository-governance-description">Canonical model facts, cross-project dependencies, Open Exchange interchange and published views are consistent, reviewable and traceable to named owners. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-architecture-model-to-repository-governance-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Architecture model to repository governance</text>
<path d="M318,194 L346,194" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-architecture-model-to-repository-governance-arrow)"/>
<path d="M642,194 L670,194" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-architecture-model-to-repository-governance-arrow)"/>
<path d="M822,288 L822,336" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-architecture-model-to-repository-governance-arrow)"/>
<path d="M678,440 L650,440" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-architecture-model-to-repository-governance-arrow)"/>
<path d="M354,440 L326,440" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-architecture-model-to-repository-governance-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Solution Architect</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">finalises project model facts,</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decisions and project</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">ownership boundaries</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Architecture Repository</text>
<text x="370" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">and Modelling Lead</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">maps model facts into the</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">canonical repository/</text>
<text x="370" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">metamodel and repository</text>
<text x="370" y="262" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">conventions</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Architecture Repository</text>
<text x="694" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Engineer</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">imports/ updates the canonical</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">repository, preserving IDs,</text>
<text x="694" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">lifecycle and provenance</text>
</g>
<g data-step="4"><rect x="678" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Model Consistency</text>
<text x="694" y="399" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Reviewer</text>
<text x="694" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">checks references, orphans,</text>
<text x="694" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">cross-project ownership,</text>
<text x="694" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">lifecycle conflicts and view</text>
<text x="694" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">drift</text>
</g>
<g data-step="5"><rect x="354" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Enterprise Architect</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">resolves enterprise/ domain</text>
<text x="370" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">overlap, shared elements and</text>
<text x="370" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">portfolio dependencies</text>
</g>
<g data-step="6"><rect x="30" y="346" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Technical Design</text>
<text x="46" y="399" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Authority Member</text>
<text x="46" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">applies architecture</text>
<text x="46" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">governance to material</text>
<text x="46" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">conformance/ exception</text>
<text x="46" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decisions</text>
</g>
</svg>
