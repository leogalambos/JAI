<svg xmlns="http://www.w3.org/2000/svg" class="ai-inline-diagram-svg" viewBox="0 0 996 602" role="img" aria-labelledby="workflow-architecture-model-to-repository-governance-title workflow-architecture-model-to-repository-governance-description">
