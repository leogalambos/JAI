<svg xmlns="http://www.w3.org/2000/svg" class="ai-inline-diagram-svg" viewBox="0 0 996 848" role="img" aria-labelledby="workflow-service-retirement-and-decommission-title workflow-service-retirement-and-decommission-description">
<!-- SPDX-License-Identifier: BSD-4-Clause; Copyright (c) 2026 Leo Galambos and the Egothor team; https://www.egothor.org -->
<title id="workflow-service-retirement-and-decommission-title">Service retirement and decommission</title>
<desc id="workflow-service-retirement-and-decommission-description">The component is retired without hidden dependencies, unmanaged data/access, stale records or unowned residual obligations, and the retirement benefit is measured. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-service-retirement-and-decommission-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Service retirement and decommission</text>
<path d="M318,182 L346,182" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-service-retirement-and-decommission-arrow)"/>
<path d="M642,182 L670,182" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-service-retirement-and-decommission-arrow)"/>
<path d="M822,264 L822,312" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-service-retirement-and-decommission-arrow)"/>
<path d="M678,428 L650,428" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-service-retirement-and-decommission-arrow)"/>
<path d="M354,428 L326,428" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-service-retirement-and-decommission-arrow)"/>
<path d="M174,534 L174,582" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-service-retirement-and-decommission-arrow)"/>
<path d="M318,686 L346,686" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-service-retirement-and-decommission-arrow)"/>
<path d="M642,686 L670,686" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-service-retirement-and-decommission-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. IT Service Owner</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">confirms retirement scope,</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">accountable owner and</text>
<text x="46" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">business/ service decision</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Technology Lifecycle and</text>
<text x="370" y="153" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Decommission Manager</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">runs repository impact</text>
<text x="370" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">analysis and builds the</text>
<text x="370" y="238" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">retirement/ disposition plan</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Data Protection Officer</text>
<text x="694" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">advises on retention, archive,</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">destruction and privacy</text>
<text x="694" y="214" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">obligations where applicable</text>
</g>
<g data-step="4"><rect x="678" y="322" width="288" height="212" rx="12" fill="#145776"/>
<text x="694" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Change Manager</text>
<text x="694" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">obtains the named human change</text>
<text x="694" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decision for the exact</text>
<text x="694" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">retirement execution window</text>
<text x="694" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and rollback boundary</text>
</g>
<g data-step="5"><rect x="354" y="322" width="288" height="212" rx="12" fill="#145776"/>
<text x="370" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Identity and Access</text>
<text x="370" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Management Engineer</text>
<text x="370" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">transfers or revokes approved</text>
<text x="370" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">nonessential access and</text>
<text x="370" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">prepares final credential</text>
<text x="370" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">closure with the shutdown</text>
<text x="370" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">operator</text>
</g>
<g data-step="6"><rect x="30" y="322" width="288" height="212" rx="12" fill="#145776"/>
<text x="46" y="351" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Site Reliability Engineer</text>
<text x="46" y="388" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">executes the approved service</text>
<text x="46" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">or platform shutdown and</text>
<text x="46" y="436" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">coordinates final credential</text>
<text x="46" y="460" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">closure with the assigned IAM</text>
<text x="46" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">actor</text>
</g>
<g data-step="7"><rect x="30" y="592" width="288" height="188" rx="12" fill="#145776"/>
<text x="46" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. IT Asset Manager</text>
<text x="46" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">reconciles CMDB/ assets and</text>
<text x="46" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">coordinates licence/ supplier</text>
<text x="46" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">closure evidence</text>
</g>
<g data-step="8"><rect x="354" y="592" width="288" height="188" rx="12" fill="#145776"/>
<text x="370" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Architecture Repository</text>
<text x="370" y="645" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">and Modelling Lead</text>
<text x="370" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">updates repository lifecycle</text>
<text x="370" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">state, removes/ retains views</text>
<text x="370" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">appropriately and records</text>
<text x="370" y="754" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">residual dependencies</text>
</g>
<g data-step="9"><rect x="678" y="592" width="288" height="188" rx="12" fill="#145776"/>
<text x="694" y="621" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Benefits Realisation</text>
<text x="694" y="645" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="694" y="682" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">measures retirement cost/</text>
<text x="694" y="706" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">risk/ complexity benefit and</text>
<text x="694" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">records variance</text>
</g>
</svg>
