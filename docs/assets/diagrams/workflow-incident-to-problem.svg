<title id="workflow-incident-to-problem-title">Incident to permanent fix</title>
<desc id="workflow-incident-to-problem-description">Service restored, cause removed, and a control changed so the class of failure does not recur. Arrows follow the numbered stages. The table below supplies handoffs and acceptance gates.</desc>
<defs><marker id="workflow-incident-to-problem-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#147eaa"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6fafc" stroke="#cbdde8"/>
<text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#102d43" font-weight="700" text-anchor="start">Incident to permanent fix</text>
<path d="M318,158 L346,158" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M642,158 L670,158" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M822,216 L822,264" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M678,332 L650,332" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M354,332 L326,332" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M174,390 L174,438" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M318,530 L346,530" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M642,530 L670,530" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M822,612 L822,660" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M678,752 L650,752" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<path d="M354,752 L326,752" fill="none" stroke="#147eaa" stroke-width="3" marker-end="url(#workflow-incident-to-problem-arrow)"/>
<g data-step="1"><rect x="30" y="100" width="288" height="116" rx="12" fill="#145776"/>
<text x="46" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">1. Service Desk Analyst</text>
<text x="46" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">captures impact and what the</text>
<text x="46" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">user was trying to do</text>
</g>
<g data-step="2"><rect x="354" y="100" width="288" height="116" rx="12" fill="#145776"/>
<text x="370" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">2. Incident Manager</text>
<text x="370" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">classifies by business effect</text>
<text x="370" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">and drives restoration</text>
</g>
<g data-step="3"><rect x="678" y="100" width="288" height="116" rx="12" fill="#145776"/>
<text x="694" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">3. Site Reliability Engineer</text>
<text x="694" y="166" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">restores service while</text>
<text x="694" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">preserving evidence</text>
</g>
<g data-step="4"><rect x="678" y="274" width="288" height="116" rx="12" fill="#145776"/>
<text x="694" y="303" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">4. Major Incident Manager</text>
<text x="694" y="340" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">takes command when impact</text>
<text x="694" y="364" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">exceeds normal handling</text>
</g>
<g data-step="5"><rect x="354" y="274" width="288" height="116" rx="12" fill="#145776"/>
<text x="370" y="303" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">5. Problem Manager</text>
<text x="370" y="340" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">establishes the systemic cause</text>
</g>
<g data-step="6"><rect x="30" y="274" width="288" height="116" rx="12" fill="#145776"/>
<text x="46" y="303" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">6. Technical Lead</text>
<text x="46" y="340" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">designs the permanent fix</text>
</g>
<g data-step="7"><rect x="30" y="448" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="477" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">7. Software Engineer</text>
<text x="46" y="514" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">implements and tests the</text>
<text x="46" y="538" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">candidate permanent fix in the</text>
<text x="46" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">explicitly permitted</text>
<text x="46" y="586" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">pre-production scope</text>
</g>
<g data-step="8"><rect x="354" y="448" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="477" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">8. Change Manager</text>
<text x="370" y="514" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">obtains the named human change</text>
<text x="370" y="538" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">decision for the permanent fix</text>
</g>
<g data-step="9"><rect x="678" y="448" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="477" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">9. Software Engineer</text>
<text x="694" y="514" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">deploys the exact reviewed and</text>
<text x="694" y="538" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">authorised permanent-fix</text>
<text x="694" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">candidate</text>
</g>
<g data-step="10"><rect x="678" y="670" width="288" height="164" rx="12" fill="#145776"/>
<text x="694" y="699" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">10. Test Analyst</text>
<text x="694" y="736" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">performs independent</text>
<text x="694" y="760" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">validation of the deployed</text>
<text x="694" y="784" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">permanent fix against</text>
<text x="694" y="808" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">predeclared criteria</text>
</g>
<g data-step="11"><rect x="354" y="670" width="288" height="164" rx="12" fill="#145776"/>
<text x="370" y="699" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">11. Detection Engineer</text>
<text x="370" y="736" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">or Observability Engineer</text>
<text x="370" y="760" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">closes the detection gap the</text>
<text x="370" y="784" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">incident exposed</text>
</g>
<g data-step="12"><rect x="30" y="670" width="288" height="164" rx="12" fill="#145776"/>
<text x="46" y="699" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">12. Continual Improvement</text>
<text x="46" y="723" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="start">Manager</text>
<text x="46" y="760" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">confirms the improvement</text>
<text x="46" y="784" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">happened and held</text>
</g>
</svg>
