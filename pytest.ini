[pytest]
addopts = --ignore=obsolete
markers =
    unit: isolated in-memory behavior without filesystem, process or service dependencies
    integration: collaboration with real filesystem, process, runtime or repository resources
    contract: producer/consumer schema, protocol, ownership or semantic interface behavior
    e2e: complete system progression or deployment rehearsal
    control: curated bounded checks of important component boundaries
    slow: expensive complete-system progression or other known long-running coverage
    security: authorization, isolation or other security invariants
    performance: benchmark or resource-budget measurement
