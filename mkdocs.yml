site_name: AI IT House Universal
site_description: Enterprise IS/IT, security, governance and justifiable delivery documentation.
site_author: Leo Galambos and Egothor Project Team
copyright: Copyright &copy; 2026 Leo Galambos and Egothor Project Team

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo-mark.svg
  favicon: assets/images/logo-mark.svg
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
  # The homepage has a distinct header/sidebar layout. Full-page navigation
  # ensures Material rebuilds those template regions when entering a guide.
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

# Build the homepage navigation from the canonical nav below and expand
# source-authored release CTA URLs. Material uses the same tree for page footers.
hooks:
  - hooks/jai_repository_links.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/enterprise.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/javascripts/mermaid.js
  - assets/javascripts/home-footer.js

extra:
  generator: false
  social:
    - icon: fontawesome/solid/book-open
      link: https://doi.org/10.13140/RG.2.2.29244.19843
      name: Towards Justifiable AI Systems
    - icon: fontawesome/solid/globe
      link: https://www.egothor.org
      name: Egothor Project

# Promote the two classes of documentation defects that caused the 26.10.4
# corrective repack to warnings so `mkdocs build --strict` blocks recurrence.
validation:
  omitted_files: warn
  unrecognized_links: warn

