# The protected release@YY.MM.VV tag is the sole publication trigger.
name: Qualify and publish JAI release

on:
  push:
    tags:
      - 'release@*'

permissions:
  contents: read

concurrency:
  group: jai-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout exact tagged source and complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit to be merged to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main || {
            echo '::error::Release tag must point to a commit already on main'
            exit 1
          }
      - name: Validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 scripts/validate_release_tag.py --tag "$RELEASE_TAG" --root .
          # Only the host step writes Actions outputs after guarded validation.
          printf 'version=%s\n' "${RELEASE_TAG#release@}" >> "$GITHUB_OUTPUT"
      - name: Verify committed VERSION and synchronized release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 scripts/versioning.py check --tag "$RELEASE_TAG" --root .
      - name: Prepare canonical qualification environment
        uses: ./.github/actions/setup-qualification
      - name: Audit mandatory sources for live provider execution
        run: python3 .ai/runtime/tools/offline_guard.py scan --root .
      - name: Build documentation site
        run: python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 -m mkdocs build --strict
      - name: Supplementary tests outside Gate A (each module once)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_test_plan.py supplementary > "$RUNNER_TEMP/jai-supplementary-tests.txt"
          mapfile -t modules < "$RUNNER_TEMP/jai-supplementary-tests.txt"
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . --timeout 900 -- python3 -u -m pytest -vv -s "${modules[@]}"
      - name: Gate checker positive and negative regression
        run: |
          printf 'G1: pass\nG2: pass\nG3: pass\nG4: pass\nG5: pass\n' > /tmp/gc-pass.txt
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/skills/it-roles-architecture/scripts/check_gates.py --skill .ai/skills/it-roles-architecture/references/solution-architect.md /tmp/gc-pass.txt
          printf 'G1: pass\n' > /tmp/gc-incomplete.txt
          if python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/skills/it-roles-architecture/scripts/check_gates.py --skill .ai/skills/it-roles-architecture/references/solution-architect.md /tmp/gc-incomplete.txt; then
            echo '::error::An incomplete gate set was incorrectly accepted'
            exit 1
          fi

      - name: Additional registry and provider checks
        run: |
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/content_spec.py lint-registry --root .
          PYTHONPATH=.ai/runtime/tools python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/provider_parity.py
      - name: Execute A-H enterprise GA qualification
        run: |
          qualification_budget="$(python3 .ai/runtime/tools/qualification_core.py budget --scope qualification)"
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . --timeout "$qualification_budget" -- python3 -u .ai/runtime/tools/release_ga.py qualify
      - name: Verify all release evidence
        run: |
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/release_policy.py check --final
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/supply_chain.py verify --root . \
            --sbom SBOM.spdx.json --provenance PROVENANCE.json \
            --compatibility COMPATIBILITY.json
      - name: Build production ZIP and SHA-256
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_VERSION:?Missing validated release version}"
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/release_bundle.py build --root . --dist dist
          python3 .ai/runtime/tools/offline_guard.py run --stream --root . -- python3 .ai/runtime/tools/evaluation_package.py build --root . \
            --output "dist/jai-extended-evaluation-${RELEASE_VERSION}.zip"
          cd dist
          test -s "ai-it-house-universal-${RELEASE_VERSION}.zip"
          sha256sum -c "ai-it-house-universal-${RELEASE_VERSION}.sha256"
      - name: Generate keyless GitHub build provenance for eligible repositories
        # Public repositories can attest on ordinary plans. For a private
        # Enterprise repository set JAI_ATTEST_PRIVATE=true after verifying
        # that its plan supports artifact attestations. Unsupported plans
        # still publish with recorded digest provenance; they are NOT signed.
        if: ${{ !github.event.repository.private || vars.JAI_ATTEST_PRIVATE == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: dist/ai-it-house-universal-*.zip
      - name: Upload qualification environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jai-ci-environment-release
          path: |
            ${{ runner.temp }}/jai-ci-environment.json
            ${{ runner.temp }}/jai-ci-python-freeze.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload immutable qualified candidate to publication job
        uses: actions/upload-artifact@v4
        with:
          name: jai-qualified-production-release
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
            QUALIFICATION-A-H.json
            COMPATIBILITY.json
            SBOM.spdx.json
            PROVENANCE.json

  publish:
    name: Publish qualified production release automatically
    needs: qualification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jai-qualified-production-release
          path: candidate
      - name: Verify candidate and create published GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.qualification.outputs.version }}
        run: |
          set -euo pipefail
          cd candidate/dist
          sha256sum -c "ai-it-house-universal-${RELEASE_VERSION}.sha256"
          sha256sum -c "jai-extended-evaluation-${RELEASE_VERSION}.zip.sha256"
          cd ..
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('QUALIFICATION-A-H.json').read_text())
          assert q['all_pass'] and set(q['gates'])==set('ABCDEFGH') and all(q['gates'].values()), 'A-H qualification did not pass'
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite $RELEASE_TAG"
            exit 1
          fi
          cat > "$RUNNER_TEMP/jai-release-notes.md" <<EOF
          # JAI ${RELEASE_VERSION}

          **Production release.** Source tag: \`${RELEASE_TAG}\`.
          All A–H quality gates passed for this tagged source and version.

          Download \`ai-it-house-universal-${RELEASE_VERSION}.zip\` and verify
          its downloaded checksum with the attached \`.sha256\` file.

          The optional \`jai-extended-evaluation-${RELEASE_VERSION}.zip\` contains
          synthetic regression inputs excluded from the core distribution.
          It is not professional approval or live provider qualification.

          This release was published automatically by GitHub Actions.
          GitHub OIDC/Sigstore attestations are generated where supported;
          verify an attested ZIP with \`gh attestation verify FILE -R ${GH_REPO}\`.
          Where attestations are unavailable, the checksum and source-linked
          provenance provide integrity evidence, **not a cryptographic signature**.
          EOF
          gh release create "$RELEASE_TAG" \
            "dist/ai-it-house-universal-${RELEASE_VERSION}.zip" \
            "dist/ai-it-house-universal-${RELEASE_VERSION}.sha256" \
            "dist/jai-extended-evaluation-${RELEASE_VERSION}.zip" \
            "dist/jai-extended-evaluation-${RELEASE_VERSION}.zip.sha256" \
            QUALIFICATION-A-H.json COMPATIBILITY.json SBOM.spdx.json PROVENANCE.json \
            --verify-tag --latest --title "$RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/jai-release-notes.md"
